name: Clip Maker checks
on:
  pull_request:
  push:
    branches: [main, feat/studio-foundation]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clipmaker_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: disposable_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - name: Reproduce local server environment during frontend build
        run: node -e "require('node:fs').writeFileSync('.env.local', 'NODE_ENV=development\n')"
      - run: npm run build
      - run: node scripts/check-frontend-build.js
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://test_user:disposable_ci_only@localhost:5432/clipmaker_test
      - run: docker build -t clip-maker-check .
